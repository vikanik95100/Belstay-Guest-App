<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belstay Guest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;500;600;700;800;900&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#16355B;--ink:#16355B;--deep:#0E2440;--sun:#FCD757;--ora:#F08D37;--cream:#F9F3E0;--bg:#FAF6EA;--paper:#FFFFFF;--teal:#80CBC4;--blue:#5576D1;--red:#F5333F;--mut:rgba(22,53,91,.62);--line:rgba(22,53,91,.12);--c:"Nunito",system-ui,sans-serif;--f:"DM Serif Display",Georgia,serif;--s:1}
html,body{height:100%}
body{font-family:var(--c);background:#EDE6D2;color:var(--navy);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--navy);color:#fff}
.top img{height:30px;display:block}
.top small{font-size:13.5px;color:rgba(255,255,255,.6)}
.sp{flex:1}
.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;font-weight:700}
.tag.hot{background:var(--sun);color:var(--navy);border-color:var(--sun);font-weight:800}
.tag[aria-pressed=true]{background:#fff;color:var(--navy)}
.layout{display:grid;grid-template-columns:236px 1fr 340px;height:calc(100% - 62px)}
body[data-notes=off] .layout{grid-template-columns:236px 1fr 0}body[data-notes=off] .notes{display:none}
.rail{padding:22px 16px;overflow:auto;border-right:1px solid rgba(22,53,91,.1);background:#F6F0DD}
.rg{margin-bottom:20px}.rg .eb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8d8576;padding:0 10px 8px;font-weight:800}
.ri{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-size:15.5px;font-weight:600;color:#2a4a72}
.ri .n{font-size:12px;color:#a39a88;width:18px;font-variant-numeric:tabular-nums}
.ri:hover{background:rgba(22,53,91,.05)}
.ri[aria-current=true]{background:var(--navy);color:#fff}.ri[aria-current=true] .n{color:rgba(255,255,255,.55)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(900px 620px at 50% 38%,#FFF9E4,#E9E0C6)}
.pw{width:calc(390px*var(--s));height:calc(844px*var(--s));position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:56px;position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(var(--s));background:#000;box-shadow:0 0 0 10px #10294a,0 0 0 11.5px #3f5f8c,0 60px 90px -25px rgba(14,36,64,.55)}
.screen{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--navy);isolation:isolate}
.hint{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:#6f6858}
.hint button{border:1.5px solid var(--navy);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:700;background:#fff}.hint button:disabled{opacity:.3}
.notes{padding:26px 26px 20px;overflow:auto;border-left:1px solid rgba(22,53,91,.1);background:#F6F0DD}
.notes .eb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ora);font-weight:800}
.notes h2{font-family:var(--f);font-weight:400;font-size:34px;margin:6px 0 8px;line-height:1.02}
.notes p.l{font-size:15.5px;line-height:1.5;color:#4b6384}
.notes ul{margin:14px 0 0 18px;font-size:15px;line-height:1.5;color:#1f3b60}.notes li{margin-bottom:8px}
.why{margin-top:18px;padding:14px 16px;border-radius:16px;background:#fff;border:1.5px solid var(--navy);box-shadow:3px 3px 0 var(--sun)}
.why p{font-size:15px;line-height:1.5;margin-top:4px}
.foot{font-size:12.5px;line-height:1.55;color:#8d8576;margin-top:20px}
/* phone internals */
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0 40px;font-weight:800;font-size:16px;pointer-events:none;color:var(--navy);transition:color .3s}
.screen[data-th=dark] .sbar{color:#fff}
.sbar i{display:inline-block;width:17px;height:11px;border-radius:3px;border:1.5px solid currentColor;margin-left:6px;position:relative;opacity:.9}
.sbar i:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px;width:60%}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:22px;background:#000;z-index:70;transition:width .55s cubic-bezier(.2,.9,.25,1.05),height .55s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;cursor:pointer;color:#fff}
.island .in{opacity:0;transition:opacity .25s;display:flex;align-items:center;gap:12px;padding:13px 18px;white-space:nowrap}
.island.open{width:358px;height:80px;border-radius:40px}.island.open .in{opacity:1;transition-delay:.2s}
.island .ico{width:42px;height:42px;border-radius:50%;background:var(--sun);color:var(--navy);display:grid;place-items:center;flex:none}
.island b{font-size:16px;font-weight:800;display:block}.island span.s{font-size:13px;color:rgba(255,255,255,.62)}
.island .t{margin-left:auto;font-family:var(--f);font-size:25px;color:var(--sun)}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .4s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;background:var(--bg)}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view.dk{background:var(--navy);color:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 0 132px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.rv{opacity:0}.on .rv{animation:up .75s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--d,0)*65ms + 100ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--mut)}
.hd{font-family:var(--f);font-weight:400;line-height:.98;letter-spacing:-.01em}
.hd em,.fr{font-style:italic}
.mk{background:linear-gradient(transparent 62%,var(--sun) 62%,var(--sun) 92%,transparent 92%);padding:0 3px;margin:0 -3px}
.h2{font-family:var(--f);font-size:28px;line-height:1.02}
.h3{font-weight:800;font-size:17px;line-height:1.15}
.m{font-size:14px;color:var(--mut);line-height:1.4;font-weight:600}
.p{font-size:16px;line-height:1.45}
.stk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--sun);color:var(--navy);font-weight:900;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.stk.n{background:var(--navy);color:#fff}.stk.o{background:var(--ora);color:#fff}.stk.t{background:var(--teal);color:var(--navy)}.stk.w{background:#fff;color:var(--navy)}.stk.g{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(8px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;position:relative;overflow:hidden;box-shadow:0 14px 30px -22px rgba(22,53,91,.5)}
.ph{background-size:cover;background-position:center;background-color:#cfd8e6;position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,36,64,.4) 0%,rgba(14,36,64,0) 34%,rgba(14,36,64,.1) 55%,rgba(14,36,64,.88) 100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;border-radius:99px;font-weight:900;font-size:16px;letter-spacing:.02em;transition:transform .15s,filter .15s;background:var(--sun);color:var(--navy)}
.btn:active{transform:scale(.97)}
.btn.n{background:var(--navy);color:#fff}.btn.w{background:#fff;color:var(--navy)}.btn.o{background:var(--ora);color:#fff}.btn.sm{height:46px;font-size:15px}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(8px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;font-size:15px;font-weight:800;border:1.5px solid var(--navy);white-space:nowrap;background:transparent;transition:all .2s}
.chip[aria-pressed=true]{background:var(--navy);color:#fff}
.chip:disabled{opacity:.3}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:rgba(14,36,64,.78);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 18px 36px -10px rgba(14,36,64,.6),inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.screen[data-tb=off] .tabbar{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.58);padding:8px 8px;min-width:56px;transition:color .2s}
.tab[aria-current=true]{color:var(--sun)}
.tab.kf{width:64px;height:64px;min-width:64px;border-radius:50%;background:var(--sun);color:var(--navy);margin-top:-30px;border:4px solid var(--bg);justify-content:center;box-shadow:0 10px 24px -6px rgba(240,141,55,.7);padding:0}
.bar{display:flex;align-items:center;gap:12px;padding:0 20px 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--navy);box-shadow:0 4px 14px -4px rgba(14,36,64,.4)}
.back.glass{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.dk .back{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}.span2{grid-column:span 2}
.tile{border-radius:26px;padding:16px;position:relative;overflow:hidden;min-height:136px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--paper)}
.big{font-family:var(--f);font-size:46px;letter-spacing:-.02em;line-height:1}.big small{font-size:.36em;letter-spacing:0;margin-left:3px;color:var(--mut);font-family:var(--c);font-weight:700}
.pulse{width:9px;height:9px;border-radius:50%;background:#2DBE7B;position:relative;display:inline-block;flex:none}
.pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #2DBE7B;animation:pl 1.8s infinite}
@keyframes pl{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mq{overflow:hidden;white-space:nowrap;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.mq div{display:inline-block;animation:mq 24s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:34px 34px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(14,36,64,.4);color:var(--navy);max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}.sheet .grab{width:48px;height:6px;border-radius:3px;background:var(--navy);opacity:.18;margin:0 auto 16px}
.scrim{position:absolute;inset:0;z-index:54;background:rgba(14,36,64,.5);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:50%;background:var(--cream);font-size:22px;font-weight:800;display:grid;place-items:center}
.stepper b{font-family:var(--f);font-size:28px;font-weight:400;min-width:26px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px;gap:14px;font-weight:600}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:800}
.msg{max-width:84%;padding:11px 16px;border-radius:22px;font-size:16px;line-height:1.4;animation:up .5s both;font-weight:600}
.msg.in{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px -8px rgba(14,36,64,.5)}
.msg.out{background:var(--navy);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:11.5px;opacity:.5;margin-top:5px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.msg .acts button{font-size:14px;font-weight:800;padding:7px 14px;border-radius:99px;background:var(--sun)}
.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--navy);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:15px;font-weight:800;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--navy);color:#fff;box-shadow:0 0 0 2px var(--sun)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kenb{position:absolute;inset:-6%;background-size:cover;background-position:50% 50%;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-2%,-1%)}}
.keybtn{position:relative;width:112px;height:112px;border-radius:50%;background:var(--sun);color:var(--navy);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2DBE7B;color:#fff}
.keybtn svg.rg{position:absolute;inset:-12px;width:136px;height:136px;transform:rotate(-90deg)}
.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;flex:none;transition:all .25s;color:transparent;background:#fff}
.chk.on{background:var(--navy);color:var(--sun)}
.seg{display:flex;background:var(--cream);border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:800;font-size:14.5px;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.toggle{width:52px;height:30px;border-radius:99px;background:rgba(22,53,91,.2);position:relative;transition:background .25s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(14,36,64,.3)}
.toggle[aria-pressed=true]{background:#2DBE7B}.toggle[aria-pressed=true]:after{transform:translateX(22px)}
/* boarding pass */
.bp{background:linear-gradient(160deg,#1d4373,var(--navy) 55%,#10294a);color:#fff;border-radius:30px;position:relative;box-shadow:0 22px 40px -18px rgba(14,36,64,.8)}
.bp:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--sun) 0 22px,var(--ora) 22px 44px);border-radius:30px 30px 0 0}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.28);margin:0 22px}
.perf:before,.perf:after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.perf:before{left:-36px}.perf:after{right:-36px}
.fld .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;font-weight:800}.fld .v{font-weight:900;font-size:17px;margin-top:2px}
/* split-flap */
.board{background:linear-gradient(180deg,#0E2440,#0a1b31);border-radius:26px;padding:14px 14px 8px;color:#fff;box-shadow:0 24px 40px -22px rgba(14,36,64,.9)}
.flap{display:inline-flex;gap:2px;perspective:500px}
.fc{width:17px;height:27px;background:#16355B;color:var(--sun);font:900 16px/27px var(--c);text-align:center;border-radius:4px;position:relative;overflow:hidden;animation:flip .55s both;animation-delay:calc(var(--i)*35ms + var(--d,0)*80ms)}
.fc:after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:rgba(0,0,0,.6)}
.fc.sp{background:transparent}.fc.sp:after{display:none}
.fc.w{color:#fff}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}55%{transform:rotateX(-14deg);opacity:1}100%{transform:none;opacity:1}}
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.1);width:100%;text-align:left}
.brow:first-of-type{border:0}
.brow[aria-selected=true]{background:rgba(252,215,87,.12);margin:0 -8px;padding:9px 8px;border-radius:12px}
.free{font-size:10.5px;font-weight:900;letter-spacing:.08em;padding:4px 9px;border-radius:99px;background:#2DBE7B;color:#06281a;white-space:nowrap}
.req{font-size:10.5px;font-weight:900;letter-spacing:.08em;padding:4px 9px;border-radius:99px;background:var(--ora);color:#2b1300;white-space:nowrap}
.nos{font-size:10.5px;font-weight:900;letter-spacing:.08em;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap}
/* map */
.dash{stroke-dasharray:6 7}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:dr 1.6s .5s forwards ease-out}
@keyframes dr{to{stroke-dashoffset:0}}
.hanger{transform-origin:50% 0;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.hanger.on{animation:sw 1.4s}
@keyframes sw{0%{transform:rotate(-14deg)}30%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
@media(max-width:1080px){.layout{grid-template-columns:200px 1fr 0}.notes{display:none}}

var NOTES={
welcome:["Arrival","Welcome","Belstay's own promise, 'Clever, wherever', over a Linate sunset. The first ten seconds should sound like the brand.",["A scrolling ticker of the brand's own words: Proudly sub-urban, City resort, Livin' Contemporary.","The guest opens the stay from the booking confirmation, or picks any of the four hotels.","The same app serves Linate, Assago, Roma Aurelia and Venezia Mestre."],"Belstay sells character over price: 'proudly peripheral'. An app with that voice makes the stay feel like a choice, not a compromise."],
home:["Arrival","Today & key card","Arrival evening on the Park, Sleep & Fly offer, shown as a boarding pass. Try holding the yellow button.",["Hold to unlock: the phone is the room key (illustrative).","The yellow tile counts down to the next free shuttle from Linate airport, every 30 minutes at the real times.","Parking is free for up to 7 days on this offer and the restaurant gives 10% off, as the real offer says.","The pill at the top is a Live Activity for the shuttle (tap it)."],"Park, Sleep & Fly guests care about two things: getting to the hotel and getting back to the plane. The first screen answers both."],
shuttle:["Arrival","Airport shuttle","The real Linate shuttle as a split-flap departure board. Switch direction and time window.",["Real rules: free for guests every 30 minutes 06:30 to 09:00 and 18:00 to 20:30; on request 09:00 to 18:00 and 20:30 to 23:00 at EUR 5 per person (minimum EUR 10 per trip); no service 23:00 to 06:30.","Tap a departure to reserve seats; free seats cost nothing, on-request trips post to the folio.","The flight line is illustrative: a production version could use flight data to suggest the right departure."],"The shuttle is the offer's biggest hook and the thing guests ask about most. A board makes it obvious and cuts calls to reception."],
room:["Arrival","Room","The Superior room: 18 to 20 sqm, parquet, a 28 cm mattress, a Belstay vanity kit and fibre Wi-Fi.",["Real features: presence-sensing lights, adjustable A/C, a desk with sockets, 43-inch smart TV with mirroring, minibar, safe, kettle, shower, hairdryer; communicating rooms and a baby cot on request.","The 'i stay here' door hanger is the brand's own and becomes a Do Not Disturb switch (try it).","Late check-out is requestable here; the weekend offer already includes check-out until 13:00."],"The room is where the app feels like a service. One tap for a cot or a late check-out beats a phone call to reception."],
seguimi:["Stay","SEGUIMI restaurant","Belstay's restaurant concept: shared plates in the middle of the table, an open grill, an aperitivo bar.",["Real hours: breakfast 06:00 to 10:00, lunch 12:30 to 14:30, dinner 19:00 to 22:30, bar 10:00 to 23:00.","The 'Living Table' and the visible grill are the concept's signature touches.","Park, Sleep & Fly includes 10% off the restaurant and bar; the Sunday pool brunch is summer only."],"A strong restaurant concept is a revenue line the app can fill, especially for guests who would otherwise eat at the airport."],
services:["Stay","Hotel & services","Everything the hotel offers, one tap each: gym, pool, garden, parking, pets, Wi-Fi.",["Gym on the ground floor, free for guests.","Outdoor pool open 1 June to 30 September, with bar service and a Sunday brunch; shown as closed for November.","Free private (unattended) parking for guests; pets up to 15 kg for EUR 20 a day."],"The FAQ answers are on the website but guests do not read it. In the app they appear at the moment of need."],
around:["Stay","Around Linate","The 'proudly sub-urban' story as a map: 10 minutes to the airport, the Idroscalo green area nearby, the centre of Milan about 20 minutes away.",["Distances come from the hotel's own offer pages. The map is schematic, not to scale.","The weekend offer is surfaced here: 15% off for 2 or more nights Friday to Sunday, early check-in and late check-out at 13:00.","The Idroscalo and Milan sections are written to be edited by the hotel."],"The hotel's whole positioning is that the suburbs are a smart choice. This screen proves it with a map."],
offers:["Book direct","Offers","The four real Linate offers as large cards.",["Park, Sleep & Fly (this guest's), Long Stay (3+ nights, 12 to 20% off with breakfast), Prenota Prima (10+ days ahead), Weekend Special (15% off, 2+ nights, Fri to Sun).","The website shows 10%, 15% and 20% in different places for the early-booking offer; the hotel should confirm which is current.","Each card opens the terms and a direct-booking button."],"A guest already in the app is the cheapest booking channel there is. Direct offers on the phone beat commission channels."],
network:["Book direct","Four hotels, one app","Linate, Assago, Roma Aurelia and Venezia Mestre in one switcher, each with its own colour from the brand system.",["Real data: rooms, Superior counts, addresses, phone numbers and facilities for all four hotels.","Tap a hotel to see its profile; each has the same app behind it.","A guest who liked Linate can book Assago in two taps."],"A chain of four needs one guest relationship, not four. The app is that relationship."],
chat:["More","Concierge chat","An answer bot built on the hotel's real FAQ, with the front desk behind it.",["Try 'check-out', 'parking', 'dog', 'gym', 'city tax', 'shuttle', 'pool' or 'cot'.","Answers use the real times, prices and policies, such as the EUR 2.50 city tax and the EUR 20 pet fee.","Anything else goes to the front desk at +39 02 553601."],"Reception answers the same dozen questions all day. The app answers them in a second and frees the team for guests."],
work:["More","Work & meet","Meeting rooms and the business offer for all four hotels; Linate shown first.",["Linate: four bright ground-floor meeting rooms for up to 60 people; Lambrate (60, two modular spaces) and Forlanini 1 and 2 (16 each).","Assago: ten meeting rooms plus a 240-person conference room and a 60-seat auditorium; Roma: seven rooms up to 330; Mestre: nine rooms up to 180.","A quote request goes straight to sales."],"Business is a core guest for these hotels. A quote button in the app turns a stay into an event."],
checkout:["More","Check-out","The folio, check-out by 11:00 and a thank-you.",["Real: check-out by 11:00 and the city tax of EUR 2.50 per person per night in Peschiera Borromeo (from age 12, up to 10 nights), paid at the hotel.","The room price is a placeholder; the offer includes parking and shuttle seats.","The next stay is one tap away."],"A clear folio ends the stay well, and a next-stay prompt starts the next booking."]};
